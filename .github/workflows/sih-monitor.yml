name: SIH 2026 result monitor

on:
  schedule:
    # GitHub Actions schedules are best-effort; later polls reconcile current state.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      enable_drive_sync:
        description: 'Run the Drive-backed cycle (requires configured OAuth and folder secrets)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Serialize writers to the shared SQLite snapshot. GitHub can replace an older
# pending run; the next poll reloads the latest committed Drive generation.
concurrency:
  group: sih-monitor-google-drive-${{ github.repository }}
  cancel-in-progress: false

jobs:
  monitor:
    # Keep the scheduled workflow visible while Drive is not configured. The
    # schedule performs a full persisted cycle after the owner enables it.
    runs-on: ubuntu-latest
    environment: sih-monitor
    timeout-minutes: 12
    env:
      DRY_RUN: 'true'
      EMAIL_TRANSPORT: mock
      ENABLE_REAL_EMAIL: 'false'
      SIH_DATABASE_PATH: data/sih_monitor.sqlite3
      SIH_SNAPSHOTS_DIR: data/snapshots
      SIH_RECIPIENTS_FILE: recipients.yaml
    steps:
      - name: Explain that scheduled Drive monitoring is not enabled yet
        if: github.event_name == 'schedule' && vars.SIH_DRIVE_SYNC_ENABLED != 'true'
        run: |
          echo "Monitoring cycle not run: configure Drive OAuth and set SIH_DRIVE_SYNC_ENABLED=true after approval."
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: github.event_name == 'workflow_dispatch' || vars.SIH_DRIVE_SYNC_ENABLED == 'true'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: github.event_name == 'workflow_dispatch' || vars.SIH_DRIVE_SYNC_ENABLED == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || vars.SIH_DRIVE_SYNC_ENABLED == 'true'
        run: python -m pip install -r requirements.txt
      - name: Run one local monitoring cycle with mock email
        if: github.event_name == 'workflow_dispatch' && inputs.enable_drive_sync != true && vars.SIH_DRIVE_SYNC_ENABLED != 'true'
        env:
          DRY_RUN: 'true'
          EMAIL_TRANSPORT: mock
          ENABLE_REAL_EMAIL: 'false'
        run: python -c "from run_monitor import run_once; print(run_once())"
      - name: Run one monitoring cycle with Drive restore and snapshot commit
        if: vars.SIH_DRIVE_SYNC_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.enable_drive_sync == true)
        env:
          DRY_RUN: 'true'
          EMAIL_TRANSPORT: mock
          ENABLE_REAL_EMAIL: 'false'
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          SIH_SENDER_EMAIL: ${{ secrets.SIH_SENDER_EMAIL }}
          SIH_RECIPIENTS_YAML: ${{ secrets.SIH_RECIPIENTS_YAML }}
        run: python -m run_monitor

